<style>
/* Layout: full-bleed 3D stage; the UI floats over it as small museum plaques (brand + actions top, timeline bottom, conversation right). */
:root {
  --night: #0f1420;
  --plaque: rgba(15, 20, 32, 0.82);
  --plaque-solid: #161d2c;
  --line: rgba(237, 230, 214, 0.16);
  --text: #ede6d6;
  --muted: #a9a596;
  --patina: #6cc2ad;
  --patina-ink: #0f1420;
  --brass: #d8b46a;
  --display: "Marcellus", "Trajan Pro", Georgia, serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--night); color: var(--text); font-family: var(--body); font-size: 14px; overflow: hidden; -webkit-font-smoothing: antialiased; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; touch-action: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--patina); outline-offset: 2px; }

.bar {
  position: fixed; left: 0; right: 0; top: 0; z-index: 5;
  padding-top: calc(14px + env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  pointer-events: none;
}
.bar > * { pointer-events: auto; }
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.mark { font-family: var(--display); font-size: 22px; letter-spacing: 0.04em; text-shadow: 0 1px 8px rgba(15,20,32,0.8); }
.mark span { color: var(--brass); }
.where { color: var(--muted); font-size: 13px; text-shadow: 0 1px 8px rgba(15,20,32,0.9), 0 0 2px rgba(15,20,32,0.8); }
.where b { color: var(--text); font-weight: 500; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--line); background: var(--plaque); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-radius: 999px; padding: 8px 14px; font-weight: 500; font-size: 13px; white-space: nowrap;
}
.btn:hover { border-color: rgba(237, 230, 214, 0.4); }
.btn.primary { background: var(--patina); color: var(--patina-ink); border-color: var(--patina); }
.btn.primary:hover { filter: brightness(1.08); }

.card {
  position: fixed; z-index: 6; left: 50%; transform: translateX(-50%);
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  width: min(440px, calc(100% - 32px));
  background: var(--plaque); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px;
  display: flex; flex-direction: column; gap: 10px;
}
.eyebrow { margin: 0; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--brass); font-variant-numeric: tabular-nums; }
.card h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 28px; text-wrap: balance; }
.card p.blurb { margin: 0; color: var(--muted); line-height: 1.5; }
.eras { list-style: none; margin: 2px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.eras li { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }

.timeline {
  position: fixed; z-index: 5; left: 0; right: 0;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: center; pointer-events: none;
}
.timeline-inner {
  pointer-events: auto; display: flex; align-items: center; gap: 14px; max-width: 100%;
  background: var(--plaque); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px;
}
.track { position: relative; display: flex; gap: 4px; overflow-x: auto; min-width: 0; scrollbar-width: none; }
.track::-webkit-scrollbar { display: none; }
.stop {
  position: relative; background: none; border: 0; border-radius: 10px; padding: 6px 12px 7px; text-align: left;
  display: flex; flex-direction: column; gap: 1px; min-width: 88px; flex: none; color: var(--muted);
}
.stop::before { content: ""; position: absolute; left: 12px; right: 12px; top: 0; height: 2px; border-radius: 2px; background: var(--line); }
.stop .y { font-family: var(--display); font-size: 18px; color: var(--text); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stop .l { font-size: 11px; white-space: nowrap; }
.stop:hover { background: rgba(237, 230, 214, 0.06); }
.stop[aria-current="true"] .y { color: var(--patina); }
.stop[aria-current="true"]::before { background: var(--patina); }
.play { flex: none; }

.talk {
  position: fixed; z-index: 6;
  right: max(16px, env(safe-area-inset-right, 0px));
  top: calc(84px + env(safe-area-inset-top, 0px));
  width: min(340px, calc(100% - 32px)); max-height: calc(100% - 210px); overflow-y: auto;
  background: var(--plaque); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px;
  display: flex; flex-direction: column; gap: 10px;
}
.talk h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 24px; }
.log { display: flex; flex-direction: column; gap: 8px; }
.log p { margin: 0; line-height: 1.5; }
.log p.me { color: var(--patina); }
.qs { display: flex; flex-direction: column; gap: 6px; }
.q { text-align: left; background: rgba(237, 230, 214, 0.05); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.q:hover { border-color: var(--patina); }
.q[disabled] { opacity: 0.45; cursor: default; border-color: var(--line); }

.hint {
  position: fixed; z-index: 4; left: 50%; transform: translateX(-50%);
  bottom: calc(108px + env(safe-area-inset-bottom, 0px));
  margin: 0; color: var(--muted); font-size: 12px; text-align: center; width: calc(100% - 32px);
  pointer-events: none; display: flex; justify-content: center;
}
.hint span { background: var(--plaque); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.hint.globe { bottom: calc(26px + env(safe-area-inset-bottom, 0px)); }
.walk {
  position: fixed; z-index: 5; left: max(16px, env(safe-area-inset-left, 0px));
  bottom: calc(118px + env(safe-area-inset-bottom, 0px));
  width: 76px; height: 76px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--plaque); font-size: 12px; font-weight: 500; user-select: none; -webkit-user-select: none; touch-action: none;
}
.walk.on { background: var(--patina); color: var(--patina-ink); }
.toast {
  position: fixed; z-index: 9; left: 50%; transform: translateX(-50%);
  top: calc(80px + env(safe-area-inset-top, 0px)); width: min(420px, calc(100% - 32px));
  background: var(--plaque-solid); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; line-height: 1.5;
}
.loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 8; background: var(--night); font-family: var(--display); font-size: 20px; color: var(--muted); }
@media (max-width: 640px) {
  .talk { top: auto; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); max-height: 46%; }
  .stop { min-width: 0; padding: 6px 10px; }
  .stop .y { font-size: 16px; }
  .timeline-inner { gap: 8px; }
  .hint { bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="stage"></div>
<div id="loading" class="loading">Unrolling the map…</div>

<header class="bar">
  <div class="brand">
    <div class="mark">Past<span>Port</span></div>
    <div id="where" class="where">Pick a place on the globe</div>
  </div>
  <div class="actions">
    <button id="btnGlobe" class="btn" hidden>Go to globe view</button>

</header>

<section id="cityCard" class="card" hidden aria-live="polite">

  <div class="row">
    <button id="ccEnter" class="btn primary">Step in</button>
    <button id="ccClose" class="btn">Back to globe</button>

</section>

<section id="timeline" class="timeline" hidden>

</section>

function colosseum(ruin) {
  const g = new THREE.Group();
  const a = 15, b = 12.5, N = 64, tiers = 4, tierH = 3.4;
  const stone = lambert(ruin ? 0xcbb48e : 0xebdcbc);
  const pierGeo = new THREE.BoxGeometry(0.9, tierH, 1.2);
  const bandGeo = new THREE.BoxGeometry(1, 0.55, 1.25);
  const piers = new THREE.InstancedMesh(pierGeo, stone, N * tiers);
  const bands = new THREE.InstancedMesh(bandGeo, stone, N * (tiers + 1));
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);
  let pi = 0, bi = 0;
  for (let i = 0; i < N; i++) {
    const t = (i / N) * Math.PI * 2, t2 = ((i + 1) / N) * Math.PI * 2;
    const x = a * Math.cos(t), z = b * Math.sin(t), x2 = a * Math.cos(t2), z2 = b * Math.sin(t2);
    const ang = Math.atan2(z2 - z, x2 - x), len = Math.hypot(x2 - x, z2 - z);
    /* Ruined: the outer ring is gone on the side facing south-west, as it is today. */
    const broken = ruin && Math.sin(t) > 0.15 && Math.cos(t) < 0.55;
    const maxTier = broken ? 2 : tiers;
    for (let k = 0; k < maxTier; k++) {
      q.setFromAxisAngle(up, -ang); p.set(x, k * tierH + tierH / 2, z); s.set(1, 1, 1);
      m.compose(p, q, s); piers.setMatrixAt(pi++, m);
    }
    for (let k = 0; k <= maxTier; k++) {
      q.setFromAxisAngle(up, -ang); p.set((x + x2) / 2, k * tierH, (z + z2) / 2); s.set(len, 1, 1);
      m.compose(p, q, s); bands.setMatrixAt(bi++, m);
    }
  }
  piers.count = pi; bands.count = bi;
  g.add(piers, bands);
  const seats = new THREE.Mesh(new THREE.CylinderGeometry(a - 1.2, a * 0.5, tierH * (ruin ? 2.6 : 3.4), 48, 1, true), lambert(ruin ? 0xb39c78 : 0xd8c6a2));
  seats.material = seats.material.clone(); seats.material.side = THREE.DoubleSide;
  seats.scale.z = b / a; seats.position.y = tierH * (ruin ? 1.3 : 1.7); g.add(seats);
  const arena = new THREE.Mesh(new THREE.CircleGeometry(a * 0.5, 32), lambert(0xd9c8a0)); arena.rotation.x = -Math.PI / 2; arena.scale.y = b / a; arena.position.y = 0.05; g.add(arena);
  g.position.set(0, 0, -34);
  return { group: g, footprints: [{ x: 0, z: -34, r: 19 }] };
}

/* Era state */
let current = { city: null, eraIdx: 0, layer: null };
const movers = []; // vehicles + walkers + smoke for the active layer

function buildLayer(city, eraIdx) {
  const era = city.eras[eraIdx];
  const st = STYLES[era.style];
  const rng = mulberry32(hash(city.id + era.year));
  const layer = { group: new THREE.Group(), risers: [], movers: [], npc: null, st };
  cityWorld.add(layer.group);
  const rise = (obj, delay) => { obj.scale.y = 0.001; layer.risers.push({ obj, delay }); layer.group.add(obj); };

  const footprints = [];
  for (const key of era.landmarks) { const L = LANDMARKS[key](); footprints.push(...L.footprints); rise(L.group, 0.15); }
  const cp = makeCenterpiece(city.centerpiece); cp.position.set(-4.6, 0, -1.2); rise(cp, 0.05);

  /* Buildings in rings around the square. A clear avenue runs north to the main landmark. */
  const smokeSources = [];
  for (let r = 14.5; r < 62; r += 6.2) {
    const n = Math.floor((Math.PI * 2 * r) / 6.4);
    for (let i = 0; i < n; i++) {
      const t = (i / n) * Math.PI * 2 + (rng() - 0.5) * 0.06 + r * 0.13;
      const x = Math.sin(t) * (r + (rng() - 0.5) * 1.2), z = -Math.cos(t) * (r + (rng() - 0.5) * 1.2);
      const along = Math.atan2(x, -z);
      if (Math.abs(along) < 0.16 + 3 / r) continue;
      if (footprints.some((f) => Math.hypot(f.x - x, f.z - z) < f.r)) continue;
      if (rng() > st.density) continue;
      const delay = 0.25 + r * 0.012 + rng() * 0.25;
      if (rng() < 0.12) { const tr = makeTree(st.trees, rng); tr.position.set(x, 0, z); rise(tr, delay); continue; }
      if (st.minaret && rng() < st.minaret) {
        const mg = new THREE.Group(); const H = 16 + rng() * 6;
        const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.75, H, 10), lambert(0xe2d2b0)); shaft.position.y = H / 2; mg.add(shaft);
        const bal = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, 0.4, 12), lambert(0xd2bf98)); bal.position.y = H * 0.72; mg.add(bal);
        const top = new THREE.Mesh(new THREE.SphereGeometry(0.75, 12, 8), lambert(0xd8c8a8)); top.scale.y = 1.5; top.position.y = H + 0.6; mg.add(top);
        mg.position.set(x, 0, z); rise(mg, delay); continue;
      }
      const { g, h } = makeBuilding(rng, st, r);
      g.position.set(x, 0, z); g.rotation.y = -t + (rng() - 0.5) * 0.1;
      rise(g, delay);
      if (st.smoke && h > 8 && rng() < 0.12) smokeSources.push(new THREE.Vector3(x, h + 0.5, z));
    }
  }
  /* Trees and lamps around the square */
  for (let i = 0; i < 8; i++) {
    const t = (i / 8) * Math.PI * 2 + Math.PI / 8;
    if (Math.abs(Math.atan2(Math.sin(t), Math.cos(t))) < 0.3) continue;
    const tr = makeTree(st.trees, rng); tr.position.set(Math.sin(t) * 13, 0, -Math.cos(t) * 13); rise(tr, 0.2 + rng() * 0.2);
  }
  if (st.lamps) {
    for (let i = 0; i < 10; i++) {
      const t = (i / 10) * Math.PI * 2;
      const lg = new THREE.Group();
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 4, 6), lambert(0x2b2b2e)); pole.position.y = 2; lg.add(pole);
      const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.22, 10, 8), new THREE.MeshBasicMaterial({ color: 0xfff1c4 })); bulb.position.y = 4.1; lg.add(bulb);
      lg.position.set(Math.sin(t) * 9.1, 0, -Math.cos(t) * 9.1); rise(lg, 0.2);
    }
  }
  /* Tram tracks */
  if (st.vehicle === 'tram') {
    for (const rr of [10.35, 10.95]) { const tr = new THREE.Mesh(new THREE.RingGeometry(rr - 0.05, rr + 0.05, 128), basic(0x6b6b6b)); tr.rotation.x = -Math.PI / 2; tr.position.y = 0.02; layer.group.add(tr); }
  }
  /* Vehicles circling the square */
  const vcount = st.vehicle === 'car' ? 9 : st.vehicle === 'tram' ? 2 : st.vehicle === 'cart' ? 3 : 0;
  for (let i = 0; i < vcount; i++) {
    const v = new THREE.Group();
    if (st.vehicle === 'car') {
      const col = pick(rng, [0xc0392b, 0xe8e4da, 0x1f5fa8, 0x2b2b2e, 0x2e7d5b, 0xe0b83a]);
      const b = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.7, 3.8), lambert(col)); b.position.y = 0.6; v.add(b);
      const c = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.6, 2), lambert(0x9fb4c0)); c.position.y = 1.2; v.add(c);
    } else if (st.vehicle === 'tram') {
      const b = new THREE.Mesh(new THREE.BoxGeometry(2.2, 2.6, 8), lambert(city.id === 'kyoto' ? 0x6a7a4a : 0xc89a3a)); b.position.y = 1.6; v.add(b);
      const r = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.2, 8.2), lambert(0x3a3a3a)); r.position.y = 3; v.add(r);
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 2.2, 4), basic(0x2b2b2b)); pole.position.set(0, 4, -1.5); pole.rotation.x = 0.6; v.add(pole);
    } else {
      const b = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.7, 2.2), lambert(0x7a5236)); b.position.y = 0.9; v.add(b);
      for (const s of [-1, 1]) { const wh = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.12, 12), lambert(0x4a3324)); wh.rotation.z = Math.PI / 2; wh.position.set(s * 0.78, 0.55, 0); v.add(wh); }
      const animal = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.1, 1.8), lambert(city.id === 'kyoto' ? 0x2b2b2b : 0x8a6a48)); animal.position.set(0, 0.95, -2.2); v.add(animal);
    }
    const speed = st.vehicle === 'car' ? 0.32 : st.vehicle === 'tram' ? 0.14 : 0.06;
    const rr = st.vehicle === 'tram' ? 10.65 : i % 2 ? 11.0 : 10.2;
    rise(v, 0.4);
    layer.movers.push({ type: 'ring', obj: v, a: (i / vcount) * Math.PI * 2 + rng(), r: rr, speed: speed * (i % 2 ? -1 : 1) });
  }
  /* People strolling in the square */
  for (let i = 0; i < 9; i++) {
    const p = makePerson(pick(rng, st.clothes), rng);
    const a = (rng() - 0.5) * Math.PI * 1.4, rr = 3 + rng() * 5;
    p.position.set(Math.sin(a) * rr, 0, -Math.cos(a) * rr); rise(p, 0.5 + rng() * 0.3);
    layer.movers.push({ type: 'walk', obj: p, target: new THREE.Vector3(), speed: 0.7 + rng() * 0.5, wait: rng() * 2, rng });
  }
  /* Chimney smoke */
  for (const src of smokeSources.slice(0, 6)) {
    for (let k = 0; k < 4; k++) {
      const puff = new THREE.Mesh(new THREE.SphereGeometry(0.7, 8, 6), new THREE.MeshLambertMaterial({ color: 0x8a8580, transparent: true, opacity: 0.5 }));
      layer.group.add(puff);
      layer.movers.push({ type: 'smoke', obj: puff, src, t: k / 4 });
    }
  }
  /* The person you can talk to */
  const npc = makePerson(pick(rng, st.clothes), rng);
  const marker = makeLabel('Talk to ' + era.npc.name); marker.scale.set(1.6, 0.4, 1); marker.position.y = 2.2; npc.add(marker);
  npc.position.set(2.4, 0, 3.2);
  npc.traverse((o) => { o.userData = { kind: 'npc' }; });
  const hitBox = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), new THREE.MeshBasicMaterial({ visible: false })); hitBox.position.y = 1; hitBox.userData = { kind: 'npc' }; npc.add(hitBox);
  rise(npc, 0.6);
  layer.npc = npc;
  return layer;
}

function disposeGroup(g) {
  g.traverse((o) => {
    if (o.geometry) o.geometry.dispose();
    if (o.material && !Array.from(matCache.values()).includes(o.material)) { if (o.material.map && !Object.values(TEX).includes(o.material.map)) o.material.map.dispose(); o.material.dispose(); }
  });
  g.removeFromParent();
}

function applyEnvironment(st, dur = 1.2) {

function setupControllers() {

    } else if (autoSpin) globeSpin.rotation.y += dt * 0.08;
    else { globeSpin.rotation.y += globeVel; globeVel *= 0.92; }
  }
  globeSpin.rotation.x = globeTilt;
  camera.getWorldPosition(camWorld);
  for (const p of pins) {
    p.pin.getWorldPosition(tmpV);
    const n = p.normal.clone().applyQuaternion(globeSpin.getWorldQuaternion(new THREE.Quaternion()));
    const toCam = camWorld.clone().sub(tmpV).normalize();
    const facing = n.dot(toCam) > 0.12;
    p.label.visible = facing;
    const active = hoverPin === p.city || selected === p.city;
    const s = 1 + Math.sin(t * 3 + p.city.lat) * 0.15 + (active ? 0.5 : 0);
    p.head.scale.setScalar(s);
    p.halo.scale.setScalar(1 + ((t * 0.8 + p.city.lon / 90) % 1) * 2.2);
    p.halo.material.opacity = 0.9 * (1 - ((t * 0.8 + p.city.lon / 90) % 1));
  }
}
function updateCity(dt, t) {
  if (!renderer.xr.isPresenting) {
    let f = 0, s = 0;
    if (keys.has('w') || keys.has('arrowup')) f += 1;
    if (keys.has('s') || keys.has('arrowdown')) f -= 1;
    if (keys.has('a') || keys.has('arrowleft')) s -= 1;
    if (keys.has('d') || keys.has('arrowright')) s += 1;
    if (walkHeld) f += 1;
    if (f || s) {
      const speed = 3.2 * dt;
      const fwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
      const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
      rig.position.addScaledVector(fwd, f * speed).addScaledVector(right, s * speed);
      clampToSquare();
    }
  }
  const L = current.layer; if (!L) return;
  for (const m of L.movers) {
    if (m.type === 'ring') {
      m.a += (m.speed * dt) / (m.r / 10);
      m.obj.position.set(Math.sin(m.a) * m.r, 0, -Math.cos(m.a) * m.r);
      m.obj.rotation.y = -m.a + (m.speed > 0 ? Math.PI : 0);
    } else if (m.type === 'walk') {
      if (m.wait > 0) { m.wait -= dt; continue; }
      if (m.target.lengthSq() === 0 || m.obj.position.distanceTo(m.target) < 0.2) {
        const a = (m.rng() - 0.5) * Math.PI * 1.4, r = 3 + m.rng() * 5;
        m.target.set(Math.sin(a) * r, 0, -Math.cos(a) * r); m.wait = m.rng() * 2.5;
      }
      const d = tmpV.copy(m.target).sub(m.obj.position); d.y = 0; const len = d.length();
      if (len > 0.001) { d.multiplyScalar(Math.min(1, (m.speed * dt) / len)); m.obj.position.add(d); m.obj.rotation.y = Math.atan2(d.x, d.z); }
      m.obj.position.y = Math.abs(Math.sin(t * 8 * m.speed)) * 0.05;
    } else if (m.type === 'smoke') {
      m.t = (m.t + dt * 0.18) % 1;
      m.obj.position.set(m.src.x + m.t * 2.5, m.src.y + m.t * 7, m.src.z);
      m.obj.scale.setScalar(0.6 + m.t * 2.2);
      m.obj.material.opacity = 0.5 * (1 - m.t);
    }
  }
  if (L.npc) {
    camera.getWorldPosition(camWorld);
    const target = Math.atan2(camWorld.x - L.npc.position.x, camWorld.z - L.npc.position.z);
    let dr = target - L.npc.rotation.y; dr = Math.atan2(Math.sin(dr), Math.cos(dr));
    L.npc.rotation.y += dr * Math.min(1, dt * 3);
    L.npc.children.forEach((c) => { if (c.isSprite) c.position.y = 2.2 + Math.sin(t * 2) * 0.05; });
  }
}

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  runTweens(dt);
  if (!renderer.xr.isPresenting) { rig.rotation.y = 0; camera.rotation.set(pitch, yaw, 0); camera.position.set(0, EYE, 0); }
  if (mode === 'globe') updateGlobe(dt, t); else updateCity(dt, t);
  if (renderer.xr.isPresenting) updateXR(dt);
  renderer.render(scene, camera);
});

/* ------------------------------------------------------------------ */
/* Start                                                               */
/* ------------------------------------------------------------------ */
(async function start() {
  try { await Promise.race([Promise.all([document.fonts.load('64px Marcellus'), document.fonts.load('500 34px Figtree')]), new Promise((r) => setTimeout(r, 1500))]); } catch (e) {}
  buildGlobe();
  setupControllers();
  scene.background = new THREE.Color(0x0f1420);
  placeGlobeCamera();
  setUIForMode();
  $('#loading').hidden = true;
  fadeTo(0, 0.8);
  if (navigator.xr && navigator.xr.isSessionSupported) {
    navigator.xr.isSessionSupported('immersive-vr').then((ok) => { if (!ok) $('#btnVR').title = 'Needs a VR headset, such as a Meta Quest'; }).catch(() => {});
  }
  window.__pastport = { enterCity: (id) => enterCity(CITIES.find((c) => c.id === id)), setEra, openTalk, goToGlobe, showCityCard: (id) => showCityCard(CITIES.find((c) => c.id === id)) };
})();
</script>
