<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant MVC Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Restaurant Finder</h1>
    <p>A simple MVC example</p>
  </header>

  <main>
    <button id="showAll">Show All Restaurants</button>
    <button id="showTopRated">Show Top Rated</button>
    <button id="showInexpensive">Show Inexpensive</button>

    <div class="filter">
      <label for="cuisineFilter">Filter by cuisine:</label>
      <select id="cuisineFilter">
        <option value="">All cuisines</option>
        <option value="American">American</option>
        <option value="Indian">Indian</option>
        <option value="Italian">Italian</option>
        <option value="Japanese">Japanese</option>
        <option value="Mexican">Mexican</option>
        <option value="Vietnamese">Vietnamese</option>
      </select>
    </div>

    <div id="restaurantList"></div>
  </main>

  <script src="model.js"></script>
  <script src="view.js"></script>
  <script src="controller.js"></script>
</body>
</html>
